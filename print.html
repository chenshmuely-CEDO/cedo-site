<style>
  @page{size:A4;margin:0}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#e6ece4}
  body{font-family:Rubik,"Noto Sans Hebrew",Arial,sans-serif;color:#1c2b1e}
  .sheet{width:210mm;height:297mm;margin:10mm auto;background:#eef4ec;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20mm 16mm 16mm;box-shadow:0 10px 40px -10px rgba(0,0,0,.25)}

  .scan{font-size:9mm;font-weight:700;color:#1f4d26;text-align:center}
  .addr{font-size:7mm;color:#3d5a40;text-align:center;margin-top:2mm;letter-spacing:.3mm}
  .badges{display:flex;gap:6mm;align-items:center;justify-content:center}
  .badges .apple{height:14mm}
  .badges .gplay{height:20.5mm;margin:-3.2mm -2.4mm}
  .toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  .toolbar button,.toolbar a{font:500 16px Rubik,sans-serif;border:0;border-radius:14px;padding:12px 22px;background:#1f4d26;color:#fff;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}
  .toolbar a{background:#fff;color:#1f4d26;border:1.5px solid #1f4d26}
  .toolbar button:active,.toolbar a:active{transform:scale(.96)}
  @media screen and (max-width:230mm){.sheet{zoom:.45;margin-top:80px}}
  @media print{html,body{background:#eef4ec}.sheet{margin:0;box-shadow:none}.qrbox{box-shadow:none;border:.6mm solid #cfe0ca}.toolbar{display:none}}
